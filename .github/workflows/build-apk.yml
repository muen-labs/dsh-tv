name: build-apk

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build-apk
    runs-on: ubuntu-latest
    # The runner image already ships the Android SDK; android-actions/setup-android
    # currently fails trying to install the retired `tools` package, so use the
    # preinstalled SDK directly.
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check the Android SDK
        run: |
          ls "$ANDROID_SDK_ROOT/build-tools" | tail -1
          ls "$ANDROID_SDK_ROOT/platforms" | tail -1
      - name: Build the single TV APK
        env:
          WHALE_TOKEN: pair-me
          WHALE_HOST: 192.168.1.10
        run: bash android/tv-assistant/build.sh
      - name: Build the Disney+ button shim
        run: bash android/disney-shim/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: whale-chan-apks
          path: |
            android/tv-assistant/TVAssistant.apk
            android/disney-shim/DisneyShim.apk

  verify-tv:
    name: verify-tv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/ui/package-lock.json
      - name: Install the plugin workspace
        working-directory: plugin/ui
        run: npm ci
      - name: Build the DSH client bundle
        working-directory: plugin/ui
        run: node build.mjs
      - name: Verify bundle, copy keys and every pane phase
        working-directory: plugin/ui
        run: node tools/verify.mjs
